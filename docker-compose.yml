services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    depends_on:
      - mongodb
    expose:
      - "8000"   # internal only

  frontend:
    image: nginx:alpine
    container_name: frontendmyapp
    ports:
      - "127.0.0.1:80:80"   # only localhost access
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:
