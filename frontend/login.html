<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">
      Login to Your Account
    </h2>

    <form id="loginForm" class="space-y-4">
      <input
        type="email"
        id="email"
        placeholder="Email"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />

      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition"
      >
        Login
      </button>

      <p id="error" class="text-red-500 text-sm text-center hidden"></p>
    </form>
  </div>

  <script>
    const API_URL = "http://localhost:8000/api/login";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("error");
      
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
         console.log("FInd this", data);
        if (!res.ok) {
          errorBox.textContent = data.detail || "Invalid login";
          errorBox.classList.remove("hidden");
          return;
        }

        // Save login session
        localStorage.setItem("token", data.access_token);
        localStorage.setItem("user_id", data.user._id);
        // console.log("User ID:",localStorage.getItem("token"));
        // Redirect to main page
        window.location.href = "index.html";

      } catch (err) {
        errorBox.textContent = "Server error. Try again.";
        errorBox.classList.remove("hidden");
      }
    });
  </script>

</body>
</html>
