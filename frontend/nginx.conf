events {}

http {
  resolver 127.0.0.11 ipv6=off;

  upstream backend_pool {
    zone backend_pool 64k;
    server backend:8000 resolve;
  }

  # Log format that shows which backend handled the request
  log_format lb '$remote_addr - $request '
                'status=$status upstream=$upstream_addr '
                'upstream_status=$upstream_status '
                'rt=$request_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log lb;

  server {
    listen 80;

    root /usr/share/nginx/html;
    index login.html index.html;

    location / {
      try_files $uri $uri/ /login.html;
    }

    location /api/ {
      proxy_pass http://backend_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}